[project]
name = "voice-of-store"
version = "1.0.0"
description = "R5 Voice-of-Store Engine: classify store feedback, detect emerging store issues, write weekly regional briefs."
requires-python = ">=3.9"
dependencies = ["numpy>=1.24", "pandas>=2.0", "scikit-learn>=1.3", "scipy>=1.10"]

[project.optional-dependencies]
web = ["Flask>=3.0", "waitress>=3.0.1"]
dev = ["pytest", "ruff", "mypy", "pip-audit"]

[tool.ruff]
line-length = 130
target-version = "py39"
src = ["src"]
extend-exclude = ["tools"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.mypy]
ignore_missing_imports = true

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = ["E501", "UP006", "UP007", "UP035", "UP045"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106", "S311", "S603"]
"scripts/*" = ["S603", "S607"]
